<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Note Preview & Confirmation</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <main class="note-review">
    <h1>Review your note</h1>

    <section class="metadata">
      <div class="field">
        <label for="title">Title</label>
        <input id="title" type="text" />
      </div>
      <div class="field">
        <label for="tags">Tags <span class="hint">(comma separated)</span></label>
        <input id="tags" type="text" />
      </div>
      <div class="field readonly">
        <label>Date</label>
        <span id="date"></span>
      </div>
      <div class="field readonly">
        <label>Duration</label>
        <span id="duration"></span>
      </div>
    </section>

    <section class="preview">
      <h2>Preview</h2>
      <div id="markdown-preview" class="markdown-body"></div>
    </section>

    <section class="actions">
      <button id="discard" class="btn btn-secondary">Discard</button>
      <button id="confirm" class="btn btn-primary">Confirm &amp; Sync</button>
    </section>

    <p id="status" role="status"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
